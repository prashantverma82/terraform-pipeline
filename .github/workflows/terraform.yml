on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-init-plan:
    name: Terraform Init and Validate and plan
    needs: lint-and-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./environments/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      #  - name: Azure Login
      #   uses: azure/login@v2
        # with:
        #   client-id: "ed15ead0-8d94-43b2-95f1-c4b7edf00d49"
        #   tenant-id: "13a90dd3-c304-4d66-9916-00384649678d"
        #   subscription-id: "f32c28c1-3f2c-4fb4-befa-70b5926fbe48"

    
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false

      - name: Terraform Plan for Deployment
        if: github.event_name != 'pull_request'
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan